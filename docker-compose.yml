services:
  postgres:
    image: postgres:18
    container_name: transcendence-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcendence-network

  engine:
    build:
      context: ./Engine
      dockerfile: Dockerfile
    container_name: transcendence-engine
    env_file: .env
    environment:
      ENGINE_PORT: ${ENGINE_PORT}
    ports:
      - "${ENGINE_PORT}:9090"
    networks:
      - transcendence-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: transcendence-backend
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
    env_file: ./.env
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/root/uploads
    networks:
      - transcendence-network
      # also on the monitoring network so Prometheus can scrape /metrics
      # without the backend's app-network exposure being affected
      - monitoring-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - transcendence-network

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: transcendence-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    # No ports: mapping -> not reachable from the host or internet, only
    # from other containers on monitoring-network (i.e. Grafana).
    restart: unless-stopped
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: transcendence-grafana
    depends_on:
      - prometheus
    env_file: ./.env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Dev-only: lets you open http://localhost:3000 to view dashboards.
      # docker-compose.prod.yml removes this mapping entirely for defense/
      # production so no monitoring port is exposed publicly.
      - "3000:3000"
    restart: unless-stopped
    networks:
      - monitoring-network

  caddy:
    image: caddy:2.11.4-alpine
    container_name: transcendence-caddy
    ports:
      - "3333:80"
      - "3334:81"
    volumes:
      - ./caddy/conf:/etc/caddy
      - ./caddy/site:/srv
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - monitoring-network
      - transcendence-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
  backend_uploads:

networks:
  transcendence-network:
    driver: bridge
  monitoring-network:
    driver: bridge
    #internal: true