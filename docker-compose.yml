services:
  postgres:
    image: postgres:18
    container_name: transcendence-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcendence-network

  engine:
    build:
      context: ./Engine
      dockerfile: Dockerfile
    container_name: transcendence-engine
    env_file: .env
    environment:
      ENGINE_PORT: ${ENGINE_PORT}
    ports:
      - "${ENGINE_PORT}:9090"
    networks:
      - transcendence-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: transcendence-backend
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
    env_file: ./.env
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/root/uploads
    networks:
      - transcendence-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - transcendence-network

volumes:
  postgres_data:
  backend_uploads:

networks:
  transcendence-network:
    driver: bridge
