global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Backend Go service - exposes /metrics via prometheus/client_golang
  - job_name: 'transcendence-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'backend'

  # Prometheus scraping itself (useful for confirming the server is alive)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    
  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:2019']

  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:1337']

  # Postgres metrics via prometheuscommunity/postgres-exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # Host-level CPU/RAM/disk/network for the machine running Docker
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'host'