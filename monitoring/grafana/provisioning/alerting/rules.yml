apiVersion: 1

groups:
  # ---------------------------------------------------------------------
  # Service availability
  # ---------------------------------------------------------------------
  - orgId: 1
    name: service-availability
    folder: Transcendence Alerts
    interval: 1m
    rules:
      - uid: backend-down
        title: BackendDown
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: up{job="transcendence-backend"}
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        labels:
          severity: critical
        annotations:
          summary: "Backend unreachable"
          description: "Prometheus has been unable to scrape transcendence-backend for over 1 minute."

      - uid: caddy-down
        title: CaddyDown
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: up{job="caddy"}
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        labels:
          severity: critical
        annotations:
          summary: "Caddy unreachable"

      - uid: cadvisor-down
        title: CadvisorDown
        condition: C
        for: 2m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: up{job="cadvisor"}
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        labels:
          severity: warning
        annotations:
          summary: "cAdvisor unreachable"

  # ---------------------------------------------------------------------
  # Caddy error rates (srv0 = frontend, srv1 = backend)
  # ---------------------------------------------------------------------
  - orgId: 1
    name: caddy-errors
    folder: Transcendence Alerts
    interval: 1m
    rules:
      - uid: caddy-backend-5xx-high
        title: CaddyBackend5xxHigh
        condition: C
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: |
                sum(rate(caddy_http_request_duration_seconds_count{server="srv1",code=~"5.."}[5m]))
                / sum(rate(caddy_http_request_duration_seconds_count{server="srv1"}[5m]))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
        labels:
          severity: critical
        annotations:
          summary: "Backend 5xx rate above 5%"
          description: "{{ $values.A }} of backend requests over the last 5m are failing with 5xx."

      - uid: caddy-frontend-5xx-high
        title: CaddyFrontend5xxHigh
        condition: C
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: |
                sum(rate(caddy_http_request_duration_seconds_count{server="srv0",code=~"5.."}[5m]))
                / sum(rate(caddy_http_request_duration_seconds_count{server="srv0"}[5m]))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
        labels:
          severity: warning
        annotations:
          summary: "Frontend 5xx rate above 5%"

      - uid: caddy-backend-4xx-spike
        title: CaddyBackend4xxSpike
        condition: C
        for: 10m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: |
                sum(rate(caddy_http_request_duration_seconds_count{server="srv1",code=~"4.."}[5m]))
                / sum(rate(caddy_http_request_duration_seconds_count{server="srv1"}[5m]))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.25]
        labels:
          severity: warning
        annotations:
          summary: "Ungewöhnlich viele 4xx auf dem Backend (>25%)"
          description: "Could indicate a broken client, scraping/bot traffic, or auth issues."

  # ---------------------------------------------------------------------
  # Caddy latency
  # ---------------------------------------------------------------------
  - orgId: 1
    name: caddy-latency
    folder: Transcendence Alerts
    interval: 1m
    rules:
      - uid: caddy-backend-latency-p95
        title: CaddyBackendLatencyHighP95
        condition: C
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: |
                histogram_quantile(0.95, sum(rate(caddy_http_request_duration_seconds_bucket{server="srv1"}[5m])) by (le))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
        labels:
          severity: warning
        annotations:
          summary: "Backend p95-Latenz > 1s"

      - uid: caddy-backend-latency-p99
        title: CaddyBackendLatencyHighP99
        condition: C
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: |
                histogram_quantile(0.99, sum(rate(caddy_http_request_duration_seconds_bucket{server="srv1"}[5m])) by (le))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2.5]
        labels:
          severity: critical
        annotations:
          summary: "Backend p99-Latenz > 2.5s"

  # ---------------------------------------------------------------------
  # Application logic (auth, websockets, deposits/withdrawals)
  # ---------------------------------------------------------------------
  - orgId: 1
    name: app-logic
    folder: Transcendence Alerts
    interval: 1m
    rules:
      - uid: login-failure-spike
        title: LoginFailureSpike
        condition: C
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: |
                sum(rate(logins_total{result="failure"}[5m]))
                / sum(rate(logins_total[5m]))
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
        labels:
          severity: warning
        annotations:
          summary: "Over 50% failed logins"
          description: "Possible brute-force attempt or auth bug."

      - uid: no-active-websocket-connections
        title: NoActiveWebsocketConnections
        condition: C
        for: 10m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: active_connections
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        labels:
          severity: warning
        annotations:
          summary: "No active WebSocket connections for 10 minutes"
          description: "Check whether the ws hub is stuck or there is simply no traffic."

      - uid: withdrawals-exceed-deposits
        title: WithdrawalsExceedDeposits
        condition: C
        for: 15m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              expr: |
                rate(withdrawal_amount_total[30m]) - (rate(deposit_amount_total[30m]) * 3)
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          severity: warning
        annotations:
          summary: "Withdrawals significantly exceed deposits (30m window)"
          description: "Not necessarily a security incident, but worth watching economically - check for bonus abuse or exploits."

  # ---------------------------------------------------------------------
  # Container resources (cAdvisor)
  # ---------------------------------------------------------------------
  - orgId: 1
    name: container-resources
    folder: Transcendence Alerts
    interval: 1m
    rules:
      - uid: container-high-cpu
        title: ContainerHighCPU
        condition: C
        for: 10m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: |
                sum(rate(container_cpu_usage_seconds_total{name=~"transcendence-.*"}[5m])) by (name)
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} using >90% of one CPU core for 10m"

      - uid: container-high-memory
        title: ContainerHighMemory
        condition: C
        for: 10m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: |
                container_memory_usage_bytes{name=~"transcendence-.*"}
                / container_spec_memory_limit_bytes{name=~"transcendence-.*"}
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} near memory limit"

      - uid: container-restarting-frequently
        title: ContainerRestartingFrequently
        condition: C
        for: 0m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: |
                increase(container_start_time_seconds{name=~"transcendence-.*"}[15m])
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} was restarted"

  # ---------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------
  - orgId: 1
    name: prometheus-self
    folder: Transcendence Alerts
    interval: 1m
    rules:
      - uid: prometheus-target-missing
        title: PrometheusTargetMissing
        condition: C
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: up
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }}/{{ $labels.instance }} down seit >5m"

      - uid: prometheus-scrape-slow
        title: PrometheusScrapeSlow
        condition: C
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus_ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: scrape_duration_seconds
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        labels:
          severity: warning
        annotations:
          summary: "Scrape of {{ $labels.job }} taking >5s"