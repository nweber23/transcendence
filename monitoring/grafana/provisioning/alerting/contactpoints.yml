apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-alerts
    receivers:
      - uid: discord-1
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          use_discord_username: true
          title: "{{ .CommonAnnotations.summary }}"
          message: |
            {{ range .Alerts }}
            **{{ .Labels.alertname }}** [{{ .Labels.severity | toUpper }}]
            {{ .Annotations.description }}
            {{ if .SilenceURL }}[View in Grafana]({{ .SilenceURL }}){{ end }}
            {{ end }}
          # Optional: add email as fallback
          # - uid: email-1
          #   type: email
          #   settings:
          #     addresses: "alerts@example.com"
          #     from_address: "grafana@example.com"