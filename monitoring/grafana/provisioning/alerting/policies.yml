apiVersion: 1

policies:
  - orgId: 1
    receiver: discord-alerts
    group_by: ['alertname', 'job']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      # Critical alerts: fast notifications, frequent reminders
      - receiver: discord-alerts
        matchers:
          - severity = critical
        group_wait: 5s
        group_interval: 5m
        repeat_interval: 30m
        continue: true
      # Warning alerts: slower notifications, less frequent reminders
      - receiver: discord-alerts
        matchers:
          - severity = warning
        group_wait: 2m
        group_interval: 15m
        repeat_interval: 6h
        continue: true
      # Info/other: batched notifications
      - receiver: discord-alerts
        group_wait: 5m
        group_interval: 30m
        repeat_interval: 24h