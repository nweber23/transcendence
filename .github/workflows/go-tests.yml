name: Go Tests

on:
  pull_request:
    branches: [dev]
    paths:
      - 'Backend/**'
      - '.github/workflows/go-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run all tests
        working-directory: ./Backend
        run: go test ./...
